name: Codex Sync runs.args with inputs

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # needed to push branch/PR
  pull-requests: write # needed to open PR

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for clean diffs)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # ratchet:actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml

      - name: Run sync
        id: sync
        run: |
          python scripts/sync_runs_args.py | tee sync.log
          # Extract HAS_CHANGES from script output (also written to GITHUB_OUTPUT)
          HAS_CHANGES=$(grep -o 'HAS_CHANGES=[01]' sync.log | tail -n1 | cut -d= -f2)
          echo "HAS_CHANGES=$HAS_CHANGES" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.sync.outputs.HAS_CHANGES == '1'
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # ratchet:peter-evans/create-pull-request@v7.0.8
        with:
          commit-message: "chore: sync runs.args with inputs (automated)"
          title: "chore: Sync runs.args with inputs"
          body: |
            This PR was created automatically to keep `runs.args` exactly in sync with the `inputs` schema for Docker-based GitHub Actions.
            - `inputs` is authoritative.
            - `runs.args` is a 2-element pair per input key:
              ```
              - --<key>
              - ${{ '\${{ inputs.<key> }}' }}
              ```
            - Order mirrors the order in `inputs`.

            If this looks good, merge to keep the container CLI contract aligned with the action API.
          branch: codex/sync-runs-args
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          labels: |
            automated
            codex
